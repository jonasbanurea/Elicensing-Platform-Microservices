apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: jelita-system
data:
  nginx.conf: |
    events {
        worker_connections 4096;
    }

    http {
        upstream user_management {
            least_conn;
            server 10.43.175.128:3001 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        upstream registration {
            least_conn;
            server 10.43.189.33:3002 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        upstream workflow {
            least_conn;
            server 10.43.80.171:3000 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        upstream survey {
            least_conn;
            server 10.43.98.73:3030 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        upstream archive {
            least_conn;
            server 10.43.106.42:3001 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        # Logging
        log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log /var/log/nginx/access.log detailed;
        error_log /var/log/nginx/error.log warn;

        # Timeouts and buffers
        client_body_timeout 60s;
        client_header_timeout 60s;
        keepalive_timeout 65s;
        send_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # HTTPS Server
        server {
            listen 30443 ssl;
            server_name _;
            
            # Apply Rate Limiting Global
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429; # Return 429 instead of 503

            
            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # User Management Service
            location /api/users/ {
                proxy_pass http://user_management/api/users/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Registration Service
            location /api/permohonan/ {
                proxy_pass http://registration/api/permohonan/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Workflow Service
            location /api/workflow/ {
                proxy_pass http://workflow/api/workflow/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Survey Service
            location /api/survey/ {
                proxy_pass http://survey/api/survey/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Archive Service
            location /api/archive/ {
                proxy_pass http://archive/api/archive/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        
        # HTTP Redirect (Optional, or keep existing HTTP)
        server {
            listen 3000;
            server_name _;
            
            location /health {
                return 200 "healthy\n"; 
            }
            # Redirect everything else to HTTPS? 
            # For now, keep HTTP accessible to avoid breaking other tests
             location / {
                proxy_pass http://user_management/; # Default
             }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: jelita-system
  labels:
    app: api-gateway
    tier: frontend
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
      name: http
    - port: 30443
      targetPort: 30443
      nodePort: 30443
      protocol: TCP
      name: https
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: jelita-system
  labels:
    app: api-gateway
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 30443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: gateway-tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: gateway-tls-certs
        secret:
          secretName: gateway-tls
