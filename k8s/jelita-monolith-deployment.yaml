---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jelita-monolith
  namespace: jelita-system
  labels:
    app: jelita-monolith
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jelita-monolith
  template:
    metadata:
      labels:
        app: jelita-monolith
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jelita-monolith
                topologyKey: kubernetes.io/hostname
      containers:
        - name: jelita-monolith
          image: jelita-monolith:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "jelita_db"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "JelitaMySQL2024"
            - name: JWT_SECRET
              value: "jelita-thesis-2024-secret-key"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: jelita-monolith
  namespace: jelita-system
  labels:
    app: jelita-monolith
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
      name: http
  selector:
    app: jelita-monolith
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jelita-monolith-hpa
  namespace: jelita-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jelita-monolith
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
