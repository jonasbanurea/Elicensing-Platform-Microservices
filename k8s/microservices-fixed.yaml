apiVersion: v1
kind: Service
metadata:
  name: registration
  namespace: jelita-system
spec:
  type: ClusterIP
  ports:
  - port: 3010
    targetPort: 3010
  selector:
    app: registration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  namespace: jelita-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
    spec:
      containers:
      - name: registration
        image: jelita-registration:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3010
        env:
        - name: PORT
          value: '3010'
        - name: DB_HOST
          value: mysql
        - name: DB_NAME
          value: jelita_db
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: JelitaMySQL2024
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 600m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
---
