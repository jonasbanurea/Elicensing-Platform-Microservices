apiVersion: apps/v1
kind: Deployment
metadata:
  name: jelita-monolith
  namespace: jelita-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: jelita-monolith
  template:
    metadata:
      labels:
        app: jelita-monolith
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jelita-monolith
              topologyKey: kubernetes.io/hostname
      containers:
      - name: jelita-monolith
        image: jelita-monolith:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "jelita_db"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "JelitaMySQL2024"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jelita-monolith
  namespace: jelita-system
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
  selector:
    app: jelita-monolith
