apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive
  namespace: jelita-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archive
  template:
    metadata:
      labels:
        app: archive
    spec:
      containers:
      - name: archive
        image: jelita-archive:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          value: "mysql"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: ""
        - name: DB_NAME
          value: "jelita_archive"
        - name: ENABLE_MTLS  # Feature flag for Scenario 4
          value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: archive
  namespace: jelita-system
spec:
  selector:
    app: archive
  ports:
  - port: 3001
    targetPort: 3001
