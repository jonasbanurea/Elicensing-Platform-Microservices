apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
  namespace: jelita-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow
  template:
    metadata:
      labels:
        app: workflow
    spec:
      containers:
      - name: workflow
        image: jelita-workflow:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "mysql"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: ""
        - name: DB_NAME
          value: "jelita_workflow"
        - name: ENABLE_MTLS  # Feature flag for Scenario 4
          value: "false" 
---
apiVersion: v1
kind: Service
metadata:
  name: workflow
  namespace: jelita-system
spec:
  selector:
    app: workflow
  ports:
  - port: 3000
    targetPort: 3000
