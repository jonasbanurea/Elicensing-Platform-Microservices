apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-archive-merged
  namespace: jelita-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-archive-merged
  template:
    metadata:
      labels:
        app: workflow-archive-merged
    spec:
      containers:
      - name: workflow-archive-merged
        image: jelita-workflow-archive:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: "3003"
        - name: WORKFLOW_DB_HOST
          value: "mysql"
        - name: WORKFLOW_DB_NAME
          value: "jelita_workflow"
        - name: WORKFLOW_DB_USER
          value: "root"
        - name: WORKFLOW_DB_PASSWORD
          value: ""
        - name: ARCHIVE_DB_HOST
          value: "mysql"
        - name: ARCHIVE_DB_NAME
          value: "jelita_archive"
        - name: ARCHIVE_DB_USER
          value: "root"
        - name: ARCHIVE_DB_PASSWORD
          value: ""
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1  
kind: Service
metadata:
  name: workflow-archive-merged
  namespace: jelita-system
spec:
  selector:
    app: workflow-archive-merged
  ports:
  - port: 3003
    targetPort: 3003
    name: http
  type: ClusterIP
